name: Real weights

# The real-checkpoint gates (1.3.0): HF GPT-2 small, pinned by revision and
# sha256, through the HF-fidelity gate and the import -> adapt -> persist
# pipeline. tula's roadmap asks for this job: it makes `gpt2-tula` (import,
# NF4-quantize, sign, save, reload, bit-compare) tula's real-weights gate.
#
# Manual on purpose: the first run downloads 548 MB from huggingface.co (later
# runs hit the cache). To run it on a schedule, add e.g.
#   schedule:
#     - cron: '17 4 * * 1'
# under `on:`.
#
# Not covered here: `gpt2-gguf` and `gpt2-cross`. Their GGUF file is made by
# tests/oracle/gen_gguf.py in a disposable Python venv (llama.cpp's converter
# conventions, so the cross gate checks against an independent writer), and
# Python is never a build, run or test dependency. Run those two locally.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpt2:
    name: GPT-2 small (real checkpoint)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GPT2_REPO: openai-community/gpt2
      GPT2_REV: 607a30d783dfa663caf39e06633721c8d4cfcd7e      # main as of 2026-11-09
      GPT2_SHA256: 248dfc3911869ec493c76e65bf2fcf7f615828b0254c12b473182f0f81d3a707
      GPT2_MODEL: ${{ github.workspace }}/models/gpt2/model.safetensors
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Cyrius toolchain
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: |
          rm -rf lib
          mkdir lib
          cyrius deps

      - name: Cache the checkpoint
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: models/gpt2
          key: gpt2-safetensors-${{ env.GPT2_SHA256 }}

      - name: Fetch the checkpoint (pinned revision, sha256-checked)
        run: |
          set -e
          mkdir -p "$(dirname "$GPT2_MODEL")"
          if [ ! -f "$GPT2_MODEL" ]; then
            curl -sSfL --retry 3 -o "$GPT2_MODEL" \
              "https://huggingface.co/$GPT2_REPO/resolve/$GPT2_REV/model.safetensors"
          fi
          echo "$GPT2_SHA256  $GPT2_MODEL" | sha256sum -c -

      - name: Build binary (DCE on)
        run: make build

      - name: HF-fidelity gate (argmax exact, maxrel <= 1e-5)
        run: make fidelity GPT2_MODEL="$GPT2_MODEL"

      - name: Import + run (batch == KV-cache decode)
        run: ./build/anukulana gpt2 "$GPT2_MODEL"

      - name: LoRA head adapter over the f64 base
        run: ./build/anukulana gpt2-lora "$GPT2_MODEL"

      - name: QLoRA over the NF4 base
        run: ./build/anukulana gpt2-qlora "$GPT2_MODEL"

      - name: Signed persistence round trip (tula's real-weights gate)
        run: ./build/anukulana gpt2-tula "$GPT2_MODEL" "$RUNNER_TEMP/ckpt.tula" "$RUNNER_TEMP/adapter.tula"
