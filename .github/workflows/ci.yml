name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

# Least privilege (1.2.2): no job needs to write.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Cyrius toolchain
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        # Reads [deps] from cyrius.cyml. M0 is stdlib-only; milestones add
        # tula/rupantara/rosnet/akshara (fetched via git+tag). lib/ must be a real dir.
        run: |
          rm -rf lib
          mkdir lib
          cyrius deps

      - name: Lint
        run: |
          fail=0
          for f in src/*.cyr tests/tcyr/*.tcyr tests/common.cyr tests/anukulana.bcyr; do
            [ -e "$f" ] || continue
            out=$(cyrius lint "$f" 2>&1 || true)
            echo "$out"
            if echo "$out" | grep -qE '^[[:space:]]*warn '; then
              echo "lint: warnings in $f"; fail=1
            fi
          done
          [ $fail -eq 0 ] || { echo "lint: warnings present"; exit 1; }

      - name: Format check
        run: |
          fail=0
          for f in src/*.cyr tests/tcyr/*.tcyr tests/common.cyr tests/anukulana.bcyr; do
            [ -e "$f" ] || continue
            if ! cyrius fmt "$f" --check > /dev/null 2>&1; then
              echo "needs fmt: $f"; fail=1
            fi
          done
          [ $fail -eq 0 ] || { echo "fmt: drift detected"; exit 1; }

      - name: Vet
        run: cyrius vet src/main.cyr

      - name: Build binary (DCE on)
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build src/main.cyr build/anukulana
          echo "binary: $(wc -c < build/anukulana) bytes"

      - name: Verify ELF
        run: xxd -l 4 build/anukulana | grep -q "7f45 4c46"

      - name: Test (CPU-only suites)
        run: |
          for f in tests/tcyr/*.tcyr; do cyrius test "$f" || exit 1; done

      - name: Docs check (every public fn documented)
        run: cyrius doc --check src/*.cyr

      - name: Benchmarks (import hot paths; numbers in docs/benchmarks.md)
        run: cyrius bench tests/anukulana.bcyr

      - name: Run the binary
        run: |
          ./build/anukulana version
          ./build/anukulana > /dev/null
          if ./build/anukulana no-such-command 2> /dev/null; then echo "unknown command must fail"; exit 1; fi

  bounds:
    # 1.3.0: every suite with cyrius's bounds checks on (run by hand for the
    # 1.2.2 audit; all green).
    name: Test (bounds-checked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Cyrius toolchain
        # the cyrius.cyml pin; the installer picks the <arch>-linux tarball
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION on $(uname -sm)"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: |
          rm -rf lib
          mkdir lib
          cyrius deps

      - name: Test (--bounds)
        run: |
          for f in tests/tcyr/*.tcyr; do cyrius test --bounds "$f" || exit 1; done

  aarch64:
    # 1.3.0: the second target, on a native runner (as tula does; qemu-user runs
    # on the host kernel, so it can't show kernel-side differences). The 1.2.2
    # audit ran every suite under qemu-aarch64 by hand; all green.
    name: Build & Test (aarch64 Linux)
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Cyrius toolchain
        # the cyrius.cyml pin; the installer picks the <arch>-linux tarball
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION on $(uname -sm)"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: |
          rm -rf lib
          mkdir lib
          cyrius deps

      - name: Build binary (DCE on)
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build src/main.cyr build/anukulana
          echo "binary: $(wc -c < build/anukulana) bytes"
          ./build/anukulana version

      - name: Test (CPU-only suites)
        run: |
          for f in tests/tcyr/*.tcyr; do cyrius test "$f" || exit 1; done

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Scan for dangerous patterns
        run: |
          FAIL=0
          scan() {
            local label="$1"; shift
            local pat="$1"; shift
            local hits
            hits=$(grep -rn "$pat" src/ 2>/dev/null | awk -F: '
              { line=$3; for(i=4;i<=NF;i++) line=line":"$i;
                sub(/^[[:space:]]+/,"",line);
                if (substr(line,1,1) != "#") print $1":"$2":"line }')
            if [ -n "$hits" ]; then echo "FAIL: $label"; echo "$hits"; FAIL=1; fi
          }
          scan "raw execve"  'syscall( *59'
          scan "raw fork"    'syscall( *57'
          scan "sys_system"  '\bsys_system\s*('
          echo "security scan complete (fail: $FAIL)"
          exit $FAIL

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check required files
        run: |
          MISSING=0
          for f in README.md CHANGELOG.md VERSION cyrius.cyml; do
            if [ -f "$f" ]; then echo "  OK: $f"; else echo "  MISSING: $f"; MISSING=1; fi
          done
          for f in CONTRIBUTING.md SECURITY.md LICENSE; do
            if [ -f "$f" ]; then echo "  OK: $f"; else echo "  WARN (optional): $f"; fi
          done
          exit $MISSING
      - name: Verify version consistency
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "FAIL: version not in CHANGELOG.md"; exit 1; }
          echo "Version consistent: $VERSION"
